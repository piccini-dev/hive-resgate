# #111: Supabase LOCAL descartável. Não vincular este diretório ao projeto hospedado.
# Gerado a partir do formato da CLI 3.2.0; migrations históricas não são reaplicadas.
project_id = "hive-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "200MiB"

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5199"
additional_redirect_urls = ["http://127.0.0.1:5199/**"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 6

[auth.email]
enabled = true
enable_confirmations = false
max_frequency = "0s"

[auth.rate_limit]
email_sent = 10000
token_refresh = 10000
sign_in_sign_ups = 10000
token_verifications = 10000

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[analytics]
enabled = false

# Metadados conferidos em leitura: somente estas funções desativam o gateway JWT.
[functions.nano-scene]
verify_jwt = false

[functions.instagram-refresh]
verify_jwt = false
