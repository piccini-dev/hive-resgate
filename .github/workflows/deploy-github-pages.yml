# A Hive e um SPA Vite. O frontend fica no GitHub Pages; auth/dados/funcoes ficam no Supabase.
# As duas chaves abaixo sao PUBLICAS de cliente (sb_publishable, Meta app id), nunca service_role.
name: Publicar Hive no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-github-pages.yml'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hive-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci
      - name: Compilar para subdiretorio GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES_BUILD: 'true'
          VITE_SUPABASE_URL: https://djlorvdehedcupeykyes.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0sT1FC53gFrX4D-f8ViZBw_12G-JWa0
          VITE_FACEBOOK_APP_ID: '2082883022288225'
          VITE_APP_ENV: teste
      - name: Verificar base e fallback de rotas SPA
        run: |
          grep -q '/hive-resgate/assets/' dist/index.html
          grep -q '/hive-resgate/favicon.svg' dist/index.html
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          test -s dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
