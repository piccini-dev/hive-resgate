# One-time, idempotent repair of hosted Supabase Auth's redirect configuration.
# Does not touch users, passwords, table data, RLS, or Edge Functions.
name: Corrigir URL de recuperação de senha

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-password-redirect.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-auth-redirect-hive
  cancel-in-progress: false

jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Conferir e corrigir URL de retorno de senha
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const projectRef = 'djlorvdehedcupeykyes';
          const home = 'https://piccini-dev.github.io/hive-resgate/';
          const reset = home + 'alterar-senha';
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          if (!token) throw new Error('SUPABASE_ACCESS_TOKEN não está configurado nas GitHub Actions Secrets. Nenhuma alteração realizada.');
          const endpoint = `https://api.supabase.com/v1/projects/${projectRef}/config/auth`;
          async function getConfig() {
            const response = await fetch(endpoint, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            });
            if (!response.ok) throw new Error(`GET auth config HTTP ${response.status}; nenhuma alteração realizada se a leitura falhou.`);
            return response.json();
          }
          const previous = await getConfig();
          if (typeof previous.site_url !== 'string') throw new Error('Configuração inesperada: site_url ausente; nenhuma alteração realizada.');
          if (previous.uri_allow_list != null && typeof previous.uri_allow_list !== 'string') {
            throw new Error('Configuração inesperada: uri_allow_list não é string; nenhuma alteração realizada.');
          }
          const list = (previous.uri_allow_list || '').split(',').map(x => x.trim()).filter(Boolean);
          const alreadyAllowed = list.includes(reset);
          const localhostDefault = /^https?:\/\/localhost(?::\d+)?(?:\/|$)/i.test(previous.site_url);
          console.log('Diagnóstico: retorno exato do GitHub Pages já permitido:', alreadyAllowed);
          console.log('Diagnóstico: URL padrão incorreta (localhost):', localhostDefault);
          console.log('Diagnóstico: entradas anteriores na lista de redirecionamentos:', list.length);
          const recoveryTemplate = previous.mailer_templates_recovery_content;
          if (typeof recoveryTemplate === 'string') {
            console.log('Template recovery usa ConfirmationURL:', /\.ConfirmationURL/.test(recoveryTemplate));
            console.log('Template recovery usa SiteURL:', /\.SiteURL/.test(recoveryTemplate));
          }
          const patch = {};
          if (!alreadyAllowed) {
            patch.uri_allow_list = [...list, reset].join(',');
          }
          // Do not change any existing real/production website default. Only fix a localhost placeholder.
          if (localhostDefault) patch.site_url = home;
          if (Object.keys(patch).length) {
            const response = await fetch(endpoint, {
              method: 'PATCH',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(patch),
            });
            if (!response.ok) throw new Error(`PATCH auth config HTTP ${response.status}. Confira permissões auth_config_write/project_admin_write. Não repetir sem investigar.`);
            console.log('Alterados apenas:', Object.keys(patch).join(', '));
          } else {
            console.log('Configuração correta, nenhuma escrita necessária.');
          }
          const current = await getConfig();
          const allowed = (current.uri_allow_list || '').split(',').map(x => x.trim());
          if (!allowed.includes(reset)) throw new Error('Verificação falhou: redirect da Hive ausente após PATCH.');
          if (localhostDefault && current.site_url !== home) throw new Error('Verificação falhou: Site URL ainda aponta para localhost.');
          console.log('Verificação concluída: redirect da recuperação autorizado, outros domínios preservados.');
          NODE
